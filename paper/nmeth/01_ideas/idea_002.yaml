idea_id: idea_002
title: >-
  Evidence-resolved metabolic capability: separating detection failure,
  recovery failure and true absence into one calibrated posterior
central_question: >-
  A missing KO can mean the HMM score fell below threshold, the genome is
  incomplete, or the capability is genuinely absent. Every current tool writes
  all three as the same zero. Can these be separated, and can the resulting
  probability be shown to be calibrated?

main_hypothesis: >-
  P(capability truly encoded) is identifiable from three channels that current
  tools discard or conflate: (1) the continuous KOfam bit score relative to
  that KO's adaptive threshold, (2) estimated genome completeness, (3) the
  phylogenetic prior from relatives, since a KO universally present in a clade
  is more likely an assembly gap than an independent loss. A model using all
  three should be calibrated under in-silico fragmentation, whereas the
  field's binary calls should be measurably over-confident in the absent
  direction.

novelty_score: 5
feasibility_score: 3
risk_score: 4

required_data:
  - Complete reference genomes to fragment in silico to known completeness (ground truth by construction)
  - Raw per-hit bit scores from the pyhmmer path (already emitted; currently discarded at threshold)
  - Reference phylogeny independent of the metabolic features (GTDB tree, not mpph's own dendrogram)
  - KEGG module definitions and per-genome ground truth (already in the benchmark)

required_methods:
  - Per-KO logistic calibration of bit score to P(true assignment), fitted on held-out genomes
  - Completeness-conditioned detection model (probability a truly present gene is recovered at completeness c)
  - Phylogenetic prior from the existing Mk model in mpph.phylo (Felsenstein pruning already implemented)
  - Propagation through KEGG module DEFINITION boolean logic to a module-level posterior
  - Reliability diagrams and expected calibration error as the primary metric, not F1

expected_figures:
  - "Fig 2a: reliability diagram - stated posterior vs observed frequency, mpph vs binary incumbents"
  - "Fig 2b: expected calibration error as a function of simulated genome completeness"
  - "Fig 2c: decomposition of a single called absence into the three channels, worked example"
  - "Fig 2d: recovery of known capabilities in fragmented genomes vs MetaPathPredict / anvi'o threshold"

key_references:
  - "ISME Communications 3:12 (2023) - 15 +/- 10% module fullness change from 70->100% completeness; persists above 90%; phylum- and module-size-dependent; own correction 'overcorrects'"
  - "MetaPathPredict, eLife 2024 - binary output, binary KO input features, no calibration reported"
  - "anvi-estimate-metabolism - hard 0.75 module completion threshold, no interval"
  - "Scoary / treeWAS / hogwash - established that the phylogenetic prior is estimable; here it is repurposed for imputation rather than association"

main_risks:
  - >-
    The three channels may not be separately identifiable from the available
    data. This is the core scientific risk and must be probed with simulation
    where the truth is known before touching real genomes.
  - >-
    The phylogenetic prior can wash out genuine lineage-specific loss - the
    exact biology many users care about. A model that imputes away real losses
    is worse than no model. Requires an explicit held-out test on verified
    true losses, and an honest statement of the regime where it should not be used.
  - >-
    Calibration on fragmented complete genomes may not transfer to real MAGs,
    whose incompleteness is non-random (GC bias, repeats, low coverage).
    Fragmentation must be non-uniform to be a fair test.

killer_experiment_or_analysis: >-
  Fragment complete genomes to known completeness, then ask whether calls
  labelled 90% confident are right about 90% of the time. If the posterior is
  not calibrated on data generated by the very process it models, it will not
  be calibrated on real MAGs and the idea fails. Calibration on simulated data
  is necessary but not sufficient; the transfer test on real MAGs with
  matched isolate genomes is the second gate.
